{% include 'dashboard/cabecalho.html' %}

<h1 class="mb-4">Lista de Turmas</h1>

<div class="row">
  <table class="table table-bordered table-striped">
    <thead class="table-dark">
        <th>ID</th>
        <th>nome_curso</th>
        <th>duracao</th>
    </thead>
    <tbody> 
        {% for item in lista %}
        <tr>
            <td>{{ item[0] }}</td> <!-- ID -->
            <td>{{ item[1] }}</td> <!-- Nome do Curso -->
            <td>{{ item[2] }}</td> <!-- Duração -->
            <td>
                <a href="/curso/editar/{{ item[0] }}" class="btn btn-primary btn-sm">Editar</a>
                <a href="/curso/remover/{{ item[0] }}" class="btn btn-danger btn-sm" onclick="return confirm('Tem certeza que deseja remover este registro?');">
                    Remover
                </a>
            </td>
        </tr>
        {% endfor %}
</tbody>
  </table>
</div>
