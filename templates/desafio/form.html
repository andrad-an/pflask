{% include 'dashboard/cabecalho.html' %}

<h1 class="mb-4">Cadastro de Pessoa</h1>

<form action="/desafio1" method="POST" class="w-50">
  <div class="mb-3">
    <label class="form-label">Nome:</label>
    <input type="text" name="nome" class="form-control" required>
  </div>
  
  <div class="mb-3">
    <label class="form-label">Data de Nascimento:</label>
    <input type="text" name="data_nascimento" placeholder="DD/MM/AAAA" class="form-control" required>
  </div>
  
  <div class="mb-3">
    <label class="form-label">CPF:</label>
    <input type="text" name="cpf" placeholder="000.000.000-00" class="form-control" required>
  </div>
  
  <div class="mb-3">
    <label class="form-label">Nome da Mãe:</label>
    <input type="text" name="nome_mae" class="form-control" required>
  </div>
  
  <button type="submit" class="btn btn-primary">Cadastrar</button>
</form>
