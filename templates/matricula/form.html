{% include 'dashboard/cabecalho.html' %}

<h2 class="mb-4">{% if matricula %}Editar{% else %}Cadastrar{% endif %} Matrícula</h2>

<form action="/matricula/salvar/{{ matricula[0] if matricula else '' }}" method="POST" class="w-50">
  <div class="mb-3">
    <label for="aluno_id" class="form-label">Aluno</label>
    <select name="aluno_id" id="aluno_id" class="form-select" required>
      {% for aluno in lista_aluno %}
        <option value="{{ aluno[0] }}" {% if matricula and aluno[0] == matricula[1] %}selected{% endif %}>{{ aluno[1] }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label for="turma_id" class="form-label">Turma (Semestre - Curso - Professor)</label>
    <select name="turma_id" id="turma_id" class="form-select" required>
      {% for turma in lista_turmas %}
        <option value="{{ turma[0] }}" {% if matricula and turma[0] == matricula[3] %}selected{% endif %}>
          {{ turma[1] }} - {{ turma[2] }} ({{ turma[3] }})
        </option>
      {% endfor %}
    </select>
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="/matricula" class="btn btn-secondary">Cancelar</a>
  </div>
</form>

{% include 'dashboard/rodape.html' %}
